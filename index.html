<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hybrid Signals</title>
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
          --ok:#15803d; --ng:#b91c1c; --warn:#b45309; --accent:#0e7490; --buy:#15803d; --sell:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --line:#30363d;
            --ok:#4ade80; --ng:#f87171; --warn:#fbbf24; --accent:#22d3ee; --buy:#4ade80; --sell:#f87171; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 4px; }
  h2 { font-size:1.15rem; margin:0 0 12px; }
  h3 { font-size:1rem; margin:16px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .muted { color:var(--muted); font-size:.85rem; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:3px 0; }
  .row .v { font-weight:600; text-align:right; }
  .big { font-size:1.1rem; font-weight:700; }
  .ok { color:var(--ok); } .ng { color:var(--ng); } .warn { color:var(--warn); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.8rem; font-weight:700; border:1px solid currentColor; }
  details summary { cursor:pointer; color:var(--muted); font-size:.9rem; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:2px; }
  input[type=number] { width:100%; padding:8px; font-size:16px; border:1px solid var(--line); border-radius:8px;
                       background:var(--bg); color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .switch { display:flex; align-items:center; gap:8px; font-size:.95rem; margin:4px 0 10px; }
  .switch input { width:20px; height:20px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:.9rem; }
  .alert { border-left:4px solid var(--warn); padding:8px 10px; background:rgba(180,83,9,.08); border-radius:6px; margin:8px 0; font-size:.9rem; }
  .act-buy { color:var(--buy); font-weight:700; } .act-sell { color:var(--sell); font-weight:700; }
  footer { font-size:.78rem; color:var(--muted); margin:24px 0 40px; }
</style>
</head>
<body>
<main>
  <h1>Hybrid Signals</h1>
  <div class="muted" id="meta">読み込み中…</div>

  <div id="signals"></div>

  <section class="card">
    <h2>あなたの設定</h2>
    <div class="switch"><input type="checkbox" id="soxlOn"><label for="soxlOn" style="margin:0;color:var(--text)">SOXL戦略を使う</label></div>
    <div class="grid">
      <div><label for="soxlBase">SOXL 購入比率（%）</label><input type="number" id="soxlBase" min="0" max="100" step="0.5"></div>
      <div><label for="newShare">Hybrid内の新Hybrid割合（%）</label><input type="number" id="newShare" min="0" max="100" step="5"></div>
    </div>
    <div class="muted" id="allocNote" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2>保有状況</h2>
    <div class="muted">株数と現金（USD）を入力してください。入力内容はこの端末のブラウザ内だけに保存され、どこにも送信されません。</div>
    <div class="grid" id="holdingInputs" style="margin-top:10px"></div>
    <h3>価格（USD）</h3>
    <div class="muted" id="priceNote"></div>
    <div class="grid" id="priceInputs" style="margin-top:6px"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="resetPrices">価格を最新終値に戻す</button>
      <button id="clearAll">入力をすべて消去</button>
    </div>
  </section>

  <section class="card">
    <h2>目標配分と売買指示</h2>
    <div id="result"><div class="muted">保有状況を入力すると表示されます。</div></div>
  </section>

  <footer>
    毎朝7:00（日本時間）頃に前営業日の米国終値で判定した結果を表示しています。投資判断はご自身の責任で行ってください。
    売買株数は入力値と表示価格による概算です。発注前に実際の価格と保有数を確認してください。
  </footer>
</main>

<script>
"use strict";
const TICKERS = ["TQQQ", "GLDM", "DGP", "SHNY", "SOXL"];
const GOLD_TICKERS = ["GLDM", "DGP", "SHNY"];
const TOLERANCE = 0.10;
const STORE_KEY = "hybrid-signals-v1";
const $ = (id) => document.getElementById(id);
const pct = (x, d = 1) => (x == null || isNaN(x)) ? "--" : (x * 100).toFixed(d) + "%";
const spct = (x, d = 1) => (x == null || isNaN(x)) ? "--" : (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const usd = (x) => (x == null || isNaN(x)) ? "--" : "$" + x.toLocaleString("en-US", { maximumFractionDigits: 0 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let SIG = null;
let store = loadStore();

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* ---------- シグナル表示 ---------- */
function positionItems(items) {
  if (!items || !items.length) return "";
  return `<details open><summary>現在地を見る</summary>${items.map((it) =>
    `<div class="row"><span>${esc(it.label)}</span><span class="v">${esc(it.value)}
      ${it.note ? `<span class="muted">(${esc(it.note)})</span>` : ""}</span></div>`).join("")}</details>`;
}

const SOXL_COND_LABELS = {
  sox_gt_ma150: "SOX > MA150", ma20_gt_ma150: "MA20 > MA150", sox_gt_ma50: "SOX > MA50",
  daily_ret_positive: "当日リターン > 0", ma200_uptrend: "MA200 上向き", vol_low: "20日ボラ < 55%",
};
const EXIT_REASON = { normal_exit: "通常EXIT", take_profit: "35%利確", below_ma200: "SOX < MA200", sox_trailing_stop: "SOX高値から-15%" };

function renderSignals() {
  const o = SIG.old_hybrid, n = SIG.new_hybrid, s = SIG.soxl;
  const goldTk = o.gold_ticker ? `${o.gold_ticker}（${o.gold_leverage}倍）` : "なし（Gold 0%）";
  let html = `
  <section class="card">
    <h2>旧Hybrid</h2>
    <div class="row"><span>NDX State</span><span class="v big">State ${o.ndx_state}: ${esc(o.ndx_state_name)}</span></div>
    ${positionItems(o.ndx_position)}
    <div class="row" style="margin-top:10px"><span>GOLD State</span><span class="v big">State ${o.gold_state}: ${esc(o.gold_state_name)}</span></div>
    ${positionItems(o.gold_position)}
    <h3>旧Hybrid内の配分</h3>
    <div class="row"><span>TQQQ</span><span class="v">${pct(o.tqqq_weight, 0)}</span></div>
    <div class="row"><span>Gold</span><span class="v">${pct(o.gold_weight, 0)} / ${esc(goldTk)}</span></div>
    <div class="muted">判定日: ${esc(o.date)}</div>
  </section>
  <section class="card">
    <h2>新Hybrid</h2>
    <div class="row"><span>NDX RiskOn <span class="muted">(10日実現ボラ ${pct(n.ndx_vol10)})</span></span><span class="v big">${n.ndx_risk_on ? "ON" : "OFF"}</span></div>
    <div class="muted">ボラ50%以上でOFF / 40%以下でON（かつ月末Cashモメンタムも要ON）</div>
    <details><summary>Cashモメンタムの内訳</summary>
      <div class="row"><span>NDX 252日リターン</span><span class="v">${spct(n.ndx_252r)}</span></div>
      <div class="row"><span>Cash 252日リターン</span><span class="v">${spct(n.cash_252r)}</span></div>
      <div class="row"><span>モメンタム</span><span class="v">${esc(n.ndx_momentum_state ?? "--")}</span></div>
      <div class="muted">最終判定日: ${esc(n.last_momentum_check_date ?? "--")}（月末のみ判定）</div>
    </details>
    <div class="row" style="margin-top:10px"><span>Gold State <span class="muted">(20日実現ボラ ${pct(n.gold_vol20)})</span></span><span class="v big">${esc(n.gold_vol_state)}</span></div>
    <div class="muted">ボラ25%以上でOFF / 15%以下でON</div>
    <h3>新Hybrid内の配分</h3>
    <div class="row"><span>TQQQ / SHNY</span><span class="v">${pct(n.ndx_weight, 0)} / ${pct(n.gold_weight, 0)}（残りは現金）</span></div>
    <div class="muted">判定日: ${esc(n.last_date)}</div>
  </section>`;
  if (s) html += renderSoxl(s);
  $("signals").innerHTML = html;
}

function renderSoxl(s) {
  const p = s.pending;
  let head;
  if (p && p.action === "BUY") head = `<span class="badge ok">BUY予定</span>`;
  else if (p && p.action === "SELL") head = `<span class="badge ng">SELL予定</span>`;
  else head = `<span class="badge">${s.model_position === "HOLD" ? "保有中" : "CASH（待機）"}</span>`;
  let body = "";
  if (s.errors && s.errors.length) {
    body += s.errors.map((e) => `<div class="alert">データエラー: ${esc(e.message || e)}</div>`).join("");
  }
  if (p) {
    const what = p.action === "BUY"
      ? `PFの${pct(p.target_ratio, 2)}を購入${p.entry_fraction < 1 ? `（利確後のため通常の${pct(p.entry_fraction, 0)}）` : ""}`
      : `全数売却（${esc(EXIT_REASON[p.reason] || p.reason || "")}）`;
    body += `<div class="alert"><b>${esc(p.execution_date)} の終値で執行</b>（シグナル ${esc(p.signal_date)}）<br>${what}</div>`;
  }
  body += `<div class="row"><span>SOX 終値 / MA200</span><span class="v">${fmt(s.close)} / ${fmt(s.ma200)}</span></div>`;
  if (s.model_position === "HOLD") {
    body += `<div class="row"><span>SOX 最高値からの位置</span><span class="v">${spct(s.dist_from_high)} <span class="muted">(-15%で売却)</span></span></div>`;
    const tp = s.take_profit;
    if (tp) body += `<div class="row"><span>利確判定（シグナル日比）</span><span class="v ${tp.hit ? "ok" : ""}">${spct(tp.signal_return)} / +35%</span></div>
      <div class="muted">基準 ${esc(tp.base_date)} の SOXL ${fmt(tp.base_price)} → 利確ライン ${fmt(tp.line_price)}</div>`;
    body += `<div class="row"><span>保有開始</span><span class="v">${esc(s.model_entry_date || s.hold_since || "--")}</span></div>`;
  } else {
    body += `<div class="row"><span>クールダウン</span><span class="v">${s.cooldown > 0 ? `残り${s.cooldown}日` : "なし"}</span></div>`;
    if (s.last_exit_date) body += `<div class="row"><span>前回売却</span><span class="v">${esc(s.last_exit_date)}（${esc(EXIT_REASON[s.last_exit_reason] || s.last_exit_reason || "")}）</span></div>`;
    body += `<div class="row"><span>次回購入の比率</span><span class="v">通常の${pct(s.next_entry_fraction, 0)}</span></div>`;
    const c = s.entry_conditions || {};
    const met = Object.values(c).filter(Boolean).length;
    body += `<details open><summary>購入条件 ${met}/6</summary>${Object.keys(SOXL_COND_LABELS).map((k) =>
      `<div class="row"><span>${SOXL_COND_LABELS[k]}</span><span class="v ${c[k] ? "ok" : "ng"}">${c[k] ? "✓" : "✗"}</span></div>`).join("")}
      <div class="muted">6条件すべて成立で翌営業日の終値で購入（クールダウン中は除く）</div></details>`;
  }
  if (s.overheat_warning) body += `<div class="alert">過熱警告: SOX が MA200 から ${spct(s.overheat)}</div>`;
  return `<section class="card">
    <h2>SOXL（v${esc(s.strategy_version)}） ${head}</h2>
    ${body}
    <div class="muted">判定日: ${esc(s.date)}</div>
  </section>`;
}
const fmt = (x) => (x == null || isNaN(x)) ? "--" : Number(x).toLocaleString("en-US", { maximumFractionDigits: 2 });

/* ---------- 入力 ---------- */
function buildInputs() {
  $("holdingInputs").innerHTML = TICKERS.map((t) =>
    `<div><label for="sh_${t}">${t}（株）</label><input type="number" id="sh_${t}" min="0" step="1" inputmode="numeric"></div>`).join("")
    + `<div><label for="cash">現金（USD）</label><input type="number" id="cash" min="0" step="0.01" inputmode="decimal"></div>`;
  $("priceInputs").innerHTML = TICKERS.map((t) =>
    `<div><label for="px_${t}">${t}</label><input type="number" id="px_${t}" min="0" step="0.01" inputmode="decimal"></div>`).join("");

  const sh = store.shares || {};
  TICKERS.forEach((t) => { $("sh_" + t).value = sh[t] ?? ""; });
  $("cash").value = store.cash ?? "";
  $("soxlOn").checked = store.soxlOn ?? true;
  $("soxlBase").value = store.soxlBase ?? Math.round((SIG.soxl?.base_ratio ?? 0.25) * 1000) / 10;
  $("newShare").value = store.newShare ?? 40;
  fillPrices(store.prices && store.priceDate === SIG.price_date ? store.prices : SIG.prices);

  document.querySelectorAll("input").forEach((el) => el.addEventListener("input", onChange));
  $("resetPrices").onclick = () => { fillPrices(SIG.prices); onChange(); };
  $("clearAll").onclick = () => {
    if (!confirm("入力した保有株数・設定をすべて消去しますか？")) return;
    localStorage.removeItem(STORE_KEY); store = {}; buildInputs(); onChange();
  };
}
function fillPrices(prices) { TICKERS.forEach((t) => { $("px_" + t).value = prices?.[t] ?? ""; }); }
const num = (id) => { const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; };

function onChange() {
  store.shares = Object.fromEntries(TICKERS.map((t) => [t, $("sh_" + t).value === "" ? "" : num("sh_" + t)]));
  store.cash = $("cash").value === "" ? "" : num("cash");
  store.soxlOn = $("soxlOn").checked;
  store.soxlBase = num("soxlBase");
  store.newShare = num("newShare");
  store.prices = Object.fromEntries(TICKERS.map((t) => [t, num("px_" + t)]));
  store.priceDate = SIG.price_date;
  saveStore();
  compute();
}

/* ---------- 配分計算（ダッシュボードと同じロジック） ---------- */
// SOXL の目標比率と保有継続モード。保有中（売却予定なし）で SOXL を持っていれば現在比率のまま売買しない
function soxlAllocation(s, on, base, h) {
  if (!on || !s || s.position !== "HOLD") return [0, false];
  if (s.model_position === "HOLD" && !s.pending && h.shares.SOXL > 0 && h.total > 0) {
    return [h.values.SOXL / h.total, true];
  }
  const frac = s.pending && s.pending.action === "BUY" ? (s.pending.entry_fraction ?? 1) : (s.current_entry_fraction ?? 1);
  return [base * frac, false];
}
// SOXL 以外の残りを 旧Hybrid : 新Hybrid に按分
function apportion(soxlRatio, newShare) {
  const avail = Math.max(0, 1 - soxlRatio);
  return [avail * (1 - newShare), avail * newShare];
}
function combinedWeights(oldR, newR) {
  const o = SIG.old_hybrid, n = SIG.new_hybrid, w = {};
  w.TQQQ = (o.tqqq_weight || 0) * oldR + (n.ndx_weight || 0) * newR;
  if (o.gold_ticker) w[o.gold_ticker] = (w[o.gold_ticker] || 0) + (o.gold_weight || 0) * oldR;
  const ng = (n.gold_weight || 0) * newR;
  if (ng > 0) w.SHNY = (w.SHNY || 0) + ng;
  return w;
}

function compute() {
  const shares = {}, prices = {}, values = {};
  let total = num("cash");
  TICKERS.forEach((t) => {
    shares[t] = num("sh_" + t); prices[t] = num("px_" + t);
    values[t] = shares[t] * prices[t]; total += values[t];
  });
  const cash = num("cash");
  const soxlOn = $("soxlOn").checked;
  const base = Math.min(1, Math.max(0, num("soxlBase") / 100));
  const newShare = Math.min(1, Math.max(0, num("newShare") / 100));
  const s = SIG.soxl;

  const sBase = soxlOn ? base : 0;
  $("allocNote").textContent = `基本配分: SOXL ${pct(sBase, 1)} / 旧Hybrid ${pct((1 - sBase) * (1 - newShare), 1)} / 新Hybrid ${pct((1 - sBase) * newShare, 1)}`
    + (soxlOn ? "（SOXL を持っていない間は、その分も旧・新Hybridに同じ割合で配分）" : "");
  $("priceNote").textContent = `初期値は ${SIG.price_date} の終値。発注前に現在値へ書き換えると正確になります。`;

  if (total <= 0) { $("result").innerHTML = `<div class="muted">保有状況を入力すると表示されます。</div>`; return; }
  const missingPx = TICKERS.filter((t) => prices[t] <= 0);

  const h = { shares, values, total };
  const [soxlRatio, holdMode] = soxlAllocation(s, soxlOn, base, h);
  const [oldR, newR] = apportion(soxlRatio, newShare);
  const w = combinedWeights(oldR, newR);
  if (soxlOn) w.SOXL = soxlRatio;
  const targetCash = Math.max(0, 1 - Object.values(w).reduce((a, b) => a + b, 0));

  // 乖離チェック（ダッシュボードと同じ ±10%）
  const reasons = [];
  const tqqqDev = Math.abs(values.TQQQ / total - (w.TQQQ || 0));
  if (tqqqDev > TOLERANCE) reasons.push(`TQQQ 乖離 ${pct(tqqqDev)}`);
  const cashDev = Math.abs(cash / total - targetCash);
  if (cashDev > TOLERANCE) reasons.push(`現金比率 乖離 ${pct(cashDev)}`);
  GOLD_TICKERS.forEach((t) => {
    const tw = w[t] || 0, cw = values[t] / total, dev = Math.abs(cw - tw);
    if (tw > 0 && dev > TOLERANCE) reasons.push(`${t} 乖離 ${pct(dev)}`);
    else if (tw <= 0 && values[t] > total * 0.01) reasons.push(`${t} 売却必要`);
  });
  if (soxlOn && !holdMode) {
    const dev = Math.abs(values.SOXL / total - soxlRatio);
    if (dev > TOLERANCE) {
      if (soxlRatio > 0) reasons.push(`SOXL 乖離 ${pct(dev)}`);
      else if (values.SOXL > total * 0.01) reasons.push("SOXL 売却必要（CASH状態）");
    }
  }
  // SOXL の BUY/SELL 予定は乖離に関係なく指示を出す
  const soxlEvent = soxlOn && s && s.pending ? s.pending.action : null;

  // 売買指示（フルリバランス）
  const tradeTickers = ["TQQQ", ...GOLD_TICKERS];
  if (soxlOn && !holdMode) tradeTickers.push("SOXL");
  const rows = [];
  tradeTickers.forEach((t) => {
    const tw = w[t] || 0, px = prices[t];
    const target = tw > 0 && px > 0 ? Math.floor(total * tw / px) : (tw > 0 ? null : 0);
    const delta = target == null ? null : target - shares[t];
    rows.push({ t, tw, cw: values[t] / total, cur: shares[t], target, delta, px });
  });
  if (soxlOn && holdMode) rows.push({ t: "SOXL", tw: soxlRatio, cw: soxlRatio, cur: shares.SOXL, target: shares.SOXL, delta: 0, px: prices.SOXL, hold: true });

  const needed = reasons.length > 0 || soxlEvent;
  let html = `<div class="row"><span>評価額合計</span><span class="v big">${usd(total)}</span></div>
    <div class="row"><span>実際の配分</span><span class="v">SOXL ${pct(soxlRatio)} / 旧Hybrid ${pct(oldR)} / 新Hybrid ${pct(newR)} / 目標現金 ${pct(targetCash)}</span></div>`;
  if (holdMode) html += `<div class="muted">SOXL は保有継続中のため、売却シグナルが出るまで売買しません（値上がり・値下がりはHybrid側で吸収）。</div>`;
  if (missingPx.length) html += `<div class="alert">価格が未入力: ${missingPx.join(", ")}</div>`;
  html += needed
    ? `<div class="alert"><b>リバランス推奨</b><br>${[...(soxlEvent ? [`SOXL ${soxlEvent === "BUY" ? "購入" : "売却"}予定（${esc(s.pending.execution_date)} 終値）`] : []), ...reasons].map(esc).join("<br>")}</div>`
    : `<div class="ok" style="margin:8px 0;font-weight:700">リバランス不要（すべて ±10% 以内）</div>`;

  html += `<table><thead><tr><th>銘柄</th><th>現在</th><th>目標</th><th>保有</th><th>目標株数</th><th>売買</th></tr></thead><tbody>`;
  rows.filter((r) => r.tw > 0 || r.cur > 0).forEach((r) => {
    let act = "—";
    if (r.hold) act = `<span class="muted">保有継続</span>`;
    else if (r.delta == null) act = `<span class="warn">価格未入力</span>`;
    else if (r.delta > 0) act = `<span class="act-buy">買 ${r.delta}</span>`;
    else if (r.delta < 0) act = `<span class="act-sell">売 ${-r.delta}</span>`;
    html += `<tr><td>${r.t}</td><td>${pct(r.cw)}</td><td>${pct(r.tw)}</td><td>${r.cur}</td><td>${r.target ?? "--"}</td><td>${act}</td></tr>`;
  });
  html += `<tr><td>現金</td><td>${pct(cash / total)}</td><td>${pct(targetCash)}</td><td colspan="3"></td></tr></tbody></table>`;
  html += `<div class="muted" style="margin-top:8px">売買欄はすべてを目標に合わせる場合の株数です。リバランス不要と出ている時は、無理に売買する必要はありません。</div>`;
  $("result").innerHTML = html;
}

/* ---------- 起動 ---------- */
fetch("signals.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    SIG = data;
    const gen = new Date(data.generated_at);
    $("meta").textContent = `判定基準日（米国）: ${data.date} ／ 更新: ${gen.toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "short" })}`;
    renderSignals();
    buildInputs();
    compute();
  })
  .catch((e) => { $("meta").textContent = "シグナルの読み込みに失敗しました: " + e; });

// タブに戻った時、データが古ければ再読み込み
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !SIG) return;
  fetch("signals.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json())
    .then((d) => { if (d.generated_at !== SIG.generated_at) location.reload(); }).catch(() => {});
});
</script>
</body>
</html>
